/* ==========================================================================
   CampusEdge Institute — Color System
   Premium academic palette: deep navy + royal blue, warm gold accent, on white.
   Base ramps first, then semantic aliases. Dark theme overrides at the bottom.
   ========================================================================== */

:root {
  /* ---- Brand: Navy (primary anchor) ---------------------------------- */
  --navy-950: #060f24;
  --navy-900: #0a1a3f;   /* core brand navy */
  --navy-800: #102a5e;
  --navy-700: #173a7e;
  --navy-600: #1f4da0;

  /* ---- Brand: Royal Blue (interactive / primary action) -------------- */
  --blue-700: #1746b5;
  --blue-600: #1f5bdb;   /* primary button */
  --blue-500: #3b78f0;
  --blue-400: #6f9df6;
  --blue-300: #a8c4fa;
  --blue-100: #e3edfd;
  --blue-50:  #f2f7fe;

  /* ---- Accent: Heritage Gold (prestige / highlights) ----------------- */
  --gold-700: #9a751f;
  --gold-600: #c79a2e;
  --gold-500: #e0b443;   /* core accent */
  --gold-300: #f0d488;
  --gold-100: #faf0d2;

  /* ---- Neutrals (warm-cool slate) ------------------------------------ */
  --white:    #ffffff;
  --slate-50:  #f6f8fb;
  --slate-100: #eef2f8;
  --slate-200: #dde4ee;
  --slate-300: #c3cedd;
  --slate-400: #98a6bd;
  --slate-500: #6b7a93;
  --slate-600: #4b5a72;
  --slate-700: #34425a;
  --slate-800: #1f2b40;
  --slate-900: #111a2b;

  /* ---- Semantic status ----------------------------------------------- */
  --success: #1f9d6b;
  --warning: #d98a1f;
  --danger:  #d6453c;
  --info:    var(--blue-600);

  /* ====== SEMANTIC ALIASES (use these in components) ================== */
  --surface-page:    var(--white);
  --surface-subtle:  var(--slate-50);
  --surface-card:    var(--white);
  --surface-inverse: var(--navy-900);
  --surface-tint:    var(--blue-50);

  --text-strong:  var(--navy-900);
  --text-body:    var(--slate-700);
  --text-muted:   var(--slate-500);
  --text-ondark:  var(--slate-100);
  --text-ondark-muted: var(--slate-400);
  --text-link:    var(--blue-600);

  --border-subtle: var(--slate-200);
  --border-default: var(--slate-300);
  --border-strong: var(--slate-400);

  --action-primary: var(--blue-600);
  --action-primary-hover: var(--blue-700);
  --action-accent: var(--gold-500);
  --action-accent-hover: var(--gold-600);

  --focus-ring: var(--blue-500);

  /* glass surfaces (glassmorphism) */
  --glass-light: rgba(255, 255, 255, 0.65);
  --glass-light-border: rgba(255, 255, 255, 0.55);
  --glass-dark: rgba(10, 26, 63, 0.55);
  --glass-dark-border: rgba(255, 255, 255, 0.16);
}

/* ====== DARK THEME ===================================================== */
:root[data-theme="dark"],
.theme-dark {
  --surface-page:    var(--navy-950);
  --surface-subtle:  var(--navy-900);
  --surface-card:    #0d1d40;
  --surface-inverse: var(--white);
  --surface-tint:    rgba(31, 91, 219, 0.12);

  --text-strong:  #f3f7ff;
  --text-body:    var(--slate-300);
  --text-muted:   var(--slate-400);
  --text-ondark:  var(--slate-100);
  --text-link:    var(--blue-400);

  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-default: rgba(255, 255, 255, 0.14);
  --border-strong: rgba(255, 255, 255, 0.24);

  --action-primary: var(--blue-500);
  --action-primary-hover: var(--blue-400);

  --glass-light: rgba(13, 29, 64, 0.55);
  --glass-light-border: rgba(255, 255, 255, 0.12);
}

/* ==========================================================================
   CampusEdge Institute — Typography Scale
   Spectral (display serif) · Plus Jakarta Sans (UI) · IBM Plex Mono (data)
   ========================================================================== */

:root {
  /* ---- Families ------------------------------------------------------ */
  --font-display: 'Spectral', 'Iowan Old Style', Georgia, serif;
  --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ---- Weights ------------------------------------------------------- */
  --fw-light: 300;      /* @kind font */
  --fw-regular: 400;    /* @kind font */
  --fw-medium: 500;     /* @kind font */
  --fw-semibold: 600;   /* @kind font */
  --fw-bold: 700;       /* @kind font */
  --fw-extrabold: 800;  /* @kind font */

  /* ---- Type scale (rem, 1rem = 16px) --------------------------------- */
  --text-xs:   0.75rem;   /* 12 */
  --text-sm:   0.875rem;  /* 14 */
  --text-base: 1rem;      /* 16 */
  --text-md:   1.125rem;  /* 18 */
  --text-lg:   1.375rem;  /* 22 */
  --text-xl:   1.75rem;   /* 28 */
  --text-2xl:  2.25rem;   /* 36 */
  --text-3xl:  3rem;      /* 48 */
  --text-4xl:  3.75rem;   /* 60 */
  --text-5xl:  4.75rem;   /* 76 */

  /* ---- Line heights -------------------------------------------------- */
  --leading-tight: 1.05;
  --leading-snug: 1.2;
  --leading-normal: 1.5;
  --leading-relaxed: 1.7;

  /* ---- Letter spacing ------------------------------------------------ */
  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide: 0.04em;
  --tracking-eyebrow: 0.16em;  /* uppercase eyebrows / labels */

  /* ---- Semantic roles ------------------------------------------------ */
  --role-eyebrow-font: var(--font-mono);
  --role-eyebrow-size: var(--text-sm);
  --role-eyebrow-tracking: var(--tracking-eyebrow);

  --role-display-font: var(--font-display);
  --role-heading-font: var(--font-display);
  --role-body-font: var(--font-sans);
}

/* ==========================================================================
   CampusEdge Institute — Spacing & Layout
   8px base rhythm.
   ========================================================================== */

:root {
  --space-0: 0;
  --space-1: 0.25rem;  /* 4  */
  --space-2: 0.5rem;   /* 8  */
  --space-3: 0.75rem;  /* 12 */
  --space-4: 1rem;     /* 16 */
  --space-5: 1.5rem;   /* 24 */
  --space-6: 2rem;     /* 32 */
  --space-7: 3rem;     /* 48 */
  --space-8: 4rem;     /* 64 */
  --space-9: 6rem;     /* 96 */
  --space-10: 8rem;    /* 128 */

  /* Layout */
  --container-max: 1240px;
  --container-wide: 1440px;
  --gutter: clamp(1.25rem, 4vw, 3rem);    /* @kind spacing */
  --section-y: clamp(4rem, 9vw, 8rem);    /* @kind spacing */
}

/* ==========================================================================
   CampusEdge Institute — Radii, Shadows, Blur, Motion
   ========================================================================== */

:root {
  /* ---- Corner radii -------------------------------------------------- */
  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-xl: 32px;
  --radius-pill: 999px;

  /* ---- Shadows (soft, cool-tinted — never pure black) ---------------- */
  --shadow-xs: 0 1px 2px rgba(10, 26, 63, 0.06);
  --shadow-sm: 0 2px 8px rgba(10, 26, 63, 0.07);
  --shadow-md: 0 10px 24px -8px rgba(10, 26, 63, 0.16);
  --shadow-lg: 0 24px 50px -16px rgba(10, 26, 63, 0.22);
  --shadow-xl: 0 40px 80px -24px rgba(10, 26, 63, 0.30);
  --shadow-gold: 0 16px 40px -12px rgba(199, 154, 46, 0.45);
  --shadow-focus: 0 0 0 3px rgba(59, 120, 240, 0.35);

  /* ---- Glass / blur -------------------------------------------------- */
  --blur-sm: 8px;   /* @kind other */
  --blur-md: 16px;  /* @kind other */
  --blur-lg: 26px;  /* @kind other */

  /* ---- Motion (calm, confident — no bounces) ------------------------- */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);     /* @kind other */
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);  /* @kind other */
  --dur-fast: 160ms;  /* @kind other */
  --dur-base: 280ms;  /* @kind other */
  --dur-slow: 520ms;  /* @kind other */
}

  * { box-sizing: border-box; }

  @media (max-width: 960px) {
