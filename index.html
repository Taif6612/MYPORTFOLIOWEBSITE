<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F1EDE4" />

    <!-- Title, description, canonical, OpenGraph, Twitter cards and JSON-LD are
         set per-route by React (vite-react-ssg Head): HomeRoute for "/" and the
         Seo component for every /guides page. Keeping them out of this template
         avoids duplicate head tags on the static pages. -->

    <!-- Fonts are self-hosted (src/styles/fonts.css). Preloading the three the hero
         uses means they are ready before the page renders: no swap, no layout shift. -->
    <link rel="preload" href="/fonts/spacegrotesk-0.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-0.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/silkscreen-0.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Hero sky for the visitor's local hour, set before first paint so there's no
         flash before three.js loads. Mirrors the sky column of KEYS in
         src/components/pixelRoom.js; Hero.jsx keeps it current afterwards. -->
    <script>
      (function () {
        var d = new Date(), h = d.getHours() + d.getMinutes() / 60, i = 0;
        var k = [[0, "0e1326"], [5, "141a36"], [6.5, "e79a7f"], [9, "8ec2ef"], [15, "86bdf0"], [18, "e98a55"], [19.6, "2a2a55"], [21, "0e1326"], [24, "0e1326"]];
        while (h >= k[i + 1][0]) i++;
        var t = (h - k[i][0]) / (k[i + 1][0] - k[i][0]), L = 0, hex = "#", w = [0.2126, 0.7152, 0.0722];
        for (var c = 0; c < 3; c++) {
          var a = Math.pow(parseInt(k[i][1].substr(c * 2, 2), 16) / 255, 2.2), b = Math.pow(parseInt(k[i + 1][1].substr(c * 2, 2), 16) / 255, 2.2), v = a + (b - a) * t;
          L += w[c] * v; hex += ("0" + Math.round(Math.pow(v, 1 / 2.2) * 255).toString(16)).slice(-2);
        }
        var s = document.documentElement.style;
        s.setProperty("--hero-bg", hex); s.setProperty("--hero-fg", L > 0.18 ? "#14171a" : "#f1ede4");
      })();
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
