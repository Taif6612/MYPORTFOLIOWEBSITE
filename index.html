<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F1EDE4" />

    <!-- Title, description, canonical, OpenGraph, Twitter cards and JSON-LD are
         set per-route by React (vite-react-ssg Head): HomeRoute for "/" and the
         Seo component for every /guides page. Keeping them out of this template
         avoids duplicate head tags on the static pages. -->

    <!-- Fonts are self-hosted (src/styles/fonts.css). Preloading the three the hero
         uses means they are ready before the page renders: no swap, no layout shift. -->
    <link rel="preload" href="/fonts/spacegrotesk-0.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-0.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/silkscreen-0.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Hero sky for the visitor's local hour, set before first paint so there's no
         flash before three.js loads. Mirrors the sky column of KEYS in
         src/components/pixelRoom.js; Hero.jsx keeps it current afterwards. -->
    <script>
      (function () {
        var d = new Date(), h = d.getHours() + d.getMinutes() / 60, i = 0;
        var k = [[0, "0e1326"], [5, "141a36"], [6.5, "e79a7f"], [9, "8ec2ef"], [15, "86bdf0"], [18, "e98a55"], [19.6, "2a2a55"], [21, "0e1326"], [24, "0e1326"]];
        while (h >= k[i + 1][0]) i++;
        var t = (h - k[i][0]) / (k[i + 1][0] - k[i][0]), L = 0, hex = "#", w = [0.2126, 0.7152, 0.0722];
        for (var c = 0; c < 3; c++) {
          var a = Math.pow(parseInt(k[i][1].substr(c * 2, 2), 16) / 255, 2.2), b = Math.pow(parseInt(k[i + 1][1].substr(c * 2, 2), 16) / 255, 2.2), v = a + (b - a) * t;
          L += w[c] * v; hex += ("0" + Math.round(Math.pow(v, 1 / 2.2) * 255).toString(16)).slice(-2);
        }
        var s = document.documentElement.style;
        s.setProperty("--hero-bg", hex); s.setProperty("--hero-fg", L > 0.18 ? "#14171a" : "#f1ede4");
      })();
    </script>
    <!-- The boot screen (homepage only): a pixel night window lighting up pane by pane, the cat on its sill, a pixel
         bar, in the hero's sky colour. Shown from the first paint; Hero calls __bootDone once the room has drawn its
         first frame (or can't run), never sooner than 0.9 s and never later than 4.5 s after load. If scripts fail,
         CSS takes it away at 9 s. Without JS it never shows (it waits for the "booting" class). -->
    <style>
      #boot { display: none; }
      html.booting { overflow: hidden; }
      html.booting #boot { display: grid; }
      html.booting .lv-hero * { animation-play-state: paused !important; } /* the hero's intro plays as the boot screen lifts */
      #boot { position: fixed; inset: 0; z-index: 90; place-items: center; background: var(--hero-bg, #0e1326); color: var(--hero-fg, #f1ede4);
        transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1); animation: boot-away 0.5s 9s forwards; }
      #boot.is-out { opacity: 0; pointer-events: none; }
      .boot-in { display: grid; justify-items: center; gap: 18px; transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1); animation: boot-rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; }
      #boot.is-out .boot-in { transform: translateY(-12px) scale(0.96); }
      .boot-win { width: 126px; height: 102px; overflow: visible; }
      .boot-win .lit { fill: #ffd890; opacity: 0; animation: boot-lit 2.4s steps(1, end) infinite; }
      .boot-win .p2 { animation-delay: 0.3s; } .boot-win .p4 { animation-delay: 0.6s; } .boot-win .p3 { animation-delay: 0.9s; }
      .boot-win .tw { animation: boot-tw 1.6s steps(1, end) infinite; } .boot-win .t2 { animation-delay: 0.5s; } .boot-win .t3 { animation-delay: 1.1s; }
      .boot-win .ta { animation: boot-tail 1s steps(1, end) infinite; } .boot-win .tb { animation: boot-tail 1s steps(1, end) 0.5s infinite; opacity: 0; }
      .boot-bar { position: relative; width: 132px; height: 9px; overflow: hidden; }
      .boot-bar::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0.16; }
      .boot-fill { position: absolute; inset: 0; background: #e8501e; transform-origin: 0 50%; transform: scaleX(0); animation: boot-fill 2.8s cubic-bezier(0.3, 0.6, 0.3, 1) 0.15s forwards; }
      .boot-bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 9px, var(--hero-bg, #0e1326) 9px 12px); } /* the gaps between its blocks */
      #boot.is-out .boot-fill { animation: none; transform: scaleX(1); }
      .boot-txt { font: 10px/1 "Silkscreen", ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85; }
      .boot-txt i { font-style: normal; animation: boot-tw 1.2s steps(1, end) infinite; } .boot-txt i + i { animation-delay: 0.2s; } .boot-txt i + i + i { animation-delay: 0.4s; }
      @keyframes boot-lit { 0% { opacity: 0; } 15% { opacity: 1; } 75% { opacity: 1; } 90% { opacity: 0; } }
      @keyframes boot-tw { 0% { opacity: 1; } 50% { opacity: 0.15; } }
      @keyframes boot-tail { 0% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes boot-fill { to { transform: scaleX(0.9); } }
      @keyframes boot-rise { from { opacity: 0; transform: translateY(8px); } }
      @keyframes boot-away { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { #boot * { animation: none !important; } #boot .lit { opacity: 1; } #boot .boot-fill { transform: scaleX(0.6); } }
    </style>
    <script>
      (function () {
        if (location.pathname !== "/") return;
        var html = document.documentElement, t0 = Date.now(), ended = false;
        html.classList.add("booting");
        window.__bootDone = function () {
          if (ended) return; ended = true;
          setTimeout(function () {
            var b = document.getElementById("boot"); html.classList.remove("booting");
            if (b) { b.style.display = "grid"; b.classList.add("is-out"); setTimeout(function () { b.remove(); }, 700); }
          }, Math.max(0, 900 - (Date.now() - t0)));
        };
        addEventListener("load", function () { setTimeout(window.__bootDone, 4500); });
      })();
    </script>
    <!-- Vercel Web Analytics: visits, pages, referrers, countries, devices. Cookieless, served from this
         domain (so the CSP stays 'self'); the numbers are in the Vercel dashboard under Analytics. -->
    <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot-in">
        <svg class="boot-win" viewBox="-5 -4 21 17" shape-rendering="crispEdges">
          <g fill="#000" opacity="0.28"><rect x="1" y="1" width="4" height="4" /><rect x="6" y="1" width="4" height="4" /><rect x="1" y="6" width="4" height="4" /><rect x="6" y="6" width="4" height="4" /></g>
          <rect class="lit p1" x="1" y="1" width="4" height="4" /><rect class="lit p2" x="6" y="1" width="4" height="4" /><rect class="lit p3" x="1" y="6" width="4" height="4" /><rect class="lit p4" x="6" y="6" width="4" height="4" />
          <g fill="currentColor">
            <rect x="0" y="0" width="11" height="1" /><rect x="0" y="10" width="11" height="1" /><rect x="0" y="0" width="1" height="11" /><rect x="10" y="0" width="1" height="11" />
            <rect x="5" y="0" width="1" height="11" /><rect x="0" y="5" width="11" height="1" /><rect x="-1" y="11" width="13" height="1" />
            <rect x="7" y="7" width="1" height="1" /><rect x="9" y="7" width="1" height="1" /><rect x="7" y="8" width="3" height="3" />
            <g class="ta"><rect x="10" y="10" width="2" height="1" /><rect x="11" y="9" width="1" height="1" /></g>
            <g class="tb"><rect x="10" y="10" width="3" height="1" /></g>
            <rect class="tw" x="-3" y="-2" width="1" height="1" /><rect class="tw t2" x="13" y="-1" width="1" height="1" /><rect class="tw t3" x="14" y="5" width="1" height="1" /><rect class="tw t2" x="-4" y="7" width="1" height="1" />
          </g>
          <rect x="7" y="8" width="1" height="1" fill="#8fd16a" /><rect x="9" y="8" width="1" height="1" fill="#8fd16a" />
        </svg>
        <div class="boot-bar"><span class="boot-fill"></span></div>
        <p class="boot-txt">Loading the room<i>.</i><i>.</i><i>.</i></p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
