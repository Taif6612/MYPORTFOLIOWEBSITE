<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F1EDE4" />

    <!-- Title, description, canonical, OpenGraph, Twitter cards and JSON-LD are
         set per-route by React (vite-react-ssg Head): HomeRoute for "/" and the
         Seo component for every /guides page. Keeping them out of this template
         avoids duplicate head tags on the static pages. -->

    <!-- Fonts are self-hosted (src/styles/fonts.css). Preloading the two the hero
         uses means they are ready before the page renders: no swap, no layout shift. -->
    <link rel="preload" href="/fonts/bricolagegrotesque-0.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrumentsans-0.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
