<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F1EDE4" />

    <!-- Title, description, canonical, OpenGraph, Twitter cards and JSON-LD are
         set per-route by React (vite-react-ssg Head): HomeRoute for "/" and the
         Seo component for every /guides page. Keeping them out of this template
         avoids duplicate head tags on the static pages. -->

    <!-- Fonts: Newsreader (display serif), Hanken Grotesk (body), Space Mono (technical captions).
         Loaded non-render-blocking (media=print → all onload) so the font CSS never
         sits on the critical path; display=swap shows fallback text immediately. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
  <body>
    <!-- Pixelation filter for the hero's "pixel" hover effect -->
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute">
      <filter id="px-filter" x="0" y="0">
        <feFlood x="2" y="2" width="1" height="1" />
        <feComposite width="5" height="5" />
        <feTile result="grid" />
        <feComposite in="SourceGraphic" in2="grid" operator="in" />
        <feMorphology operator="dilate" radius="2.5" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
